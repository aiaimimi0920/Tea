name: Release Tea Tag

on:
  push:
    tags:
      - 'V*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish manually
        required: true
        type: string

permissions:
  contents: read

jobs:
  test_linux_startup_lock:
    name: Test portable startup lock on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Test startup lock
        run: cargo test --locked -p tea_startup_lock

      - name: Audit Rust dependency locks
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
          cargo audit --file apps/desktop/src-tauri/Cargo.lock

  build_windows_package:
    name: Build and verify Windows package
    needs: test_linux_startup_lock
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Resolve and validate release tag
        id: release_tag
        shell: powershell
        env:
          TEA_INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:TEA_INPUT_TAG
          } else {
            $tag = $env:GITHUB_REF_NAME
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is required."
          }

          if ($tag -cnotmatch '\AV\d+\.\d+\.\d+\z') {
            throw "Release tag must match Vx.x.x. Received: $tag"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ref=refs/tags/$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "TEA_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.release_tag.outputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Install desktop npm dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Desktop TypeScript typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Desktop ESLint (react-hooks)
        working-directory: apps/desktop
        run: npm run lint

      - name: Desktop unit tests
        working-directory: apps/desktop
        run: npm test

      - name: Desktop dependency audit
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      - name: Rust format check
        run: cargo fmt --check --all

      - name: Desktop Tauri Rust format check
        run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Rust Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Desktop Tauri Rust Clippy
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --workspace

      - name: Desktop Tauri Rust tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Launcher process contract
        shell: powershell
        run: |
          cargo build --locked -p tea-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-tea-stop-process-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-tea-launcher-contract.ps1 -DaemonExe .\target\debug\tea-daemon.exe

      - name: Release reparse-point containment contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-tea-release-reparse-contract.ps1

      - name: Build portable Tea release package
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-local-tea-release.ps1 -OutputDir "release\Tea" -VersionId "$env:TEA_TAG" -Force

      - name: Verify portable Tea release package
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-tea-release-package.ps1 -PackageDir ".\release\Tea\$env:TEA_TAG" -RunSmoke

      - name: Release manifest and asset contracts
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-tea-release-manifest-contract.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-tea-release-asset-copy-contract.ps1 -PackageDir ".\release\Tea\$env:TEA_TAG"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-tea-release-asset-reparse-contract.ps1 -PackageDir ".\release\Tea\$env:TEA_TAG"

      - name: Package minimal release zip
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-release-zip.ps1 `
            -PackageDir ".\release\Tea\$env:TEA_TAG" `
            -OutputDir ".\release\Tea" `
            -Tag "$env:TEA_TAG" `
            -Force

      - name: Upload verified GitHub release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tea-github-release-assets
          path: |
            release/Tea/tea-windows-x64-${{ steps.release_tag.outputs.tag }}.zip
            release/Tea/tea-windows-x64-${{ steps.release_tag.outputs.tag }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish_release:
    name: Publish GitHub release
    needs: build_windows_package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TEA_TAG: ${{ needs.build_windows_package.outputs.tag }}

    steps:
      - name: Download verified GitHub release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tea-github-release-assets
          path: release-assets

      - name: Verify downloaded release asset checksum
        shell: pwsh
        run: |
          $zipName = "tea-windows-x64-$env:TEA_TAG.zip"
          $zipPath = Join-Path $PWD "release-assets/$zipName"
          $sidecarPath = "$zipPath.sha256"
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Downloaded Tea release ZIP is missing: $zipPath"
          }
          if (-not (Test-Path -LiteralPath $sidecarPath -PathType Leaf)) {
            throw "Downloaded Tea release SHA256 sidecar is missing: $sidecarPath"
          }
          $content = [System.IO.File]::ReadAllText($sidecarPath)
          $match = [System.Text.RegularExpressions.Regex]::Match(
            $content,
            '\A([0-9a-fA-F]{64})  ([^\r\n]+)\r\n\z',
            [System.Text.RegularExpressions.RegexOptions]::CultureInvariant
          )
          if (-not $match.Success) {
            throw "Downloaded Tea release SHA256 sidecar is not canonical."
          }
          if ($match.Groups[2].Value -cne $zipName) {
            throw "Downloaded Tea release SHA256 sidecar names the wrong ZIP."
          }
          $actual = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $match.Groups[1].Value.ToLowerInvariant()) {
            throw "Downloaded Tea release ZIP SHA256 does not match its sidecar."
          }

      - name: Publish portable GitHub release asset
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ env.TEA_TAG }}
          name: ${{ env.TEA_TAG }}
          generate_release_notes: true
          files: |
            release-assets/tea-windows-x64-${{ env.TEA_TAG }}.zip
            release-assets/tea-windows-x64-${{ env.TEA_TAG }}.zip.sha256
          overwrite_files: false
          fail_on_unmatched_files: true
