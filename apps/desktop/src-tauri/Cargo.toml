[package]
name = "tea"
version = "0.1.0"
description = "Tea desktop shell"
authors = ["Tea contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "tea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.2", features = [] }

[workspace]

# Aggressive release profile for the packaged desktop binary: fat LTO + single
# codegen unit + size optimization + symbol stripping. Increases build time
# (fat LTO on the Tauri dependency tree is notably slower) for a smaller exe.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
